<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas - Desafio 014</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;           
            text-align: center;
        }
        th {
            background-color: gray;
            color: white;
            padding: 10px;
        }
        caption {
            font-size: 1.3em;
            font-weight: bold;
            margin: 10px;
            padding: 10px;
            background-color: lightgray;
        }
        .media {
            text-align: left;

        }
    </style>
</head>
<body>
    <h1>Desafio 014</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="colgroup">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="colgroup">Média</th>
                <tr>
                    <th scope="colgroup">Nota 1</th>
                    <th scope="colgroup">Nota 2</th>
                    
                </tr>
                
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="4">Exatas</td>
                <td>Matemática</td>
                <td>8.5</td>
                <td>7.5</td>
                <td>7.83</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>7.0</td>
                <td>8.5</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>8.0</td>
                <td>8.5</td>
                <td>8.5</td>
            </tr>
            <tr>
                <td>Biología</td>
                <td>8.0</td>
                <td>8.5</td>
                <td>8.5</td>
            </tr>
            <tr>
                <th colspan="4" class="media" scope="row">
                    Média de Exatas
                </th>
                <th>8.08</th>
            </tr>
            <tr>
                <td rowspan="2">Humanas</td>
                <td>História</td>
                <td>9.0</td>
                <td>8.5</td>
                <td>8.33</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>8.5</td>
                <td>8.5</td>
                <td>8.5</td>
            </tr>   
            <tr>
                <th colspan="4" class="media" scope="row">
                    Média de Humanas
                </th>
                <th>8.00</th>
            </tr>
        </tbody>
    </table>
</body>
</html>
