<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iFrame</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 2px solid #000;
            border-radius: 8px;
        }
    </style>
    
</head>
<body>
    <!--
    O Tamanh Padrão do iFrame é 300px de largura por 150px de altura
    O CSS acima altera o tamanho padrão para 400px por 400px e sobrepōe a definição de largura e altura do HTML abaixo.
    -->
    <h1>Testando o uso de iFrame</h1>
    <p>
        Acessando o site do
        <iframe src="https://www.cursoemvideo.com" width="300" height="200" title="Curso em Vídeo">
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em Vídeo</a>
        </iframe>
         para aprender a programar.
    </p>
    <p>
        O repositório do Robertis no GitHub
         <iframe src="https://rgr-robertis.github.io" frameborder="0" width="300" height="200" title="github do Robertis">
            <a href="https://rgr-robertis.github.io" target="_blank">github do Robertis</a>

         </iframe>
        também é muito legal!
    </p>
</body>
</html>
