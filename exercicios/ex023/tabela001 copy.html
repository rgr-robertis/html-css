<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            border-collapse: collapse;
            width: 400px;
        }
        tr.linha {
            background-color: gray;
        }

        td {
            border: 1px solid black;
        }
        td.dado {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Minha primeira Tabela</h1>
    <!--
    HIERARQUIA DE TABELAS SIMPLES
        TABLE = tabela
            THEAD = cabeçalho da tabela
                TR = linha da tabela
                    TH
            TBODY = corpo da tabela
                TR = linha da tabela
                    TD = célula da tabela
    
    -->
<table>

    <!--  No CSS3 näo precisa fechar as TAG's <tr> e <td>  -->
    <tr> <!-- Primeira. Linha-->
        <td>A1
        <td>B1
        <td>C1
    
    <tr class="linha"> <!-- Segunda Linha-->
        <td>A2
        <td>B2
        <td>C2
    
    <tr> <!-- Terceira Linha-->
        <td>A3</td>
        <td>B3</td>
        <td>C3</td>
    </tr>   
    <tr> <!-- Quarta Linha-->
        <td>A4</td>
        <td class="dado">B4</td>
        <td>C4</td>
    </tr> 
    <tr> <!-- Quinta Linha-->
        <td>A5</td>
        <td>B5</td>
    </tr>  
    <tr> <!-- Sexta Linha-->
        <td>A6</td>
    </tr>
</table>
</body>
</html>
